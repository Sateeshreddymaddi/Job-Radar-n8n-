<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Radar</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0c0a08;
  --bg2: #12100d;
  --panel: #16130f;
  --panel2: #1e1a15;
  --edge: #2e2820;
  --edge2: #3e3528;
  --ink: #f2ead8;
  --ink2: #a89878;
  --ink3: #6a5d4e;
  --gold: #d4a843;
  --gold-light: #f0d060;
  --gold-dim: rgba(212,168,67,.10);
  --gold-glow: 0 0 32px rgba(212,168,67,.18);
  --amber: #e8a020;
  --amber-dim: rgba(232,160,32,.10);
  --red: #e85555;
  --red-dim: rgba(232,85,85,.08);
  --blue: #7eaadc;
  --blue-dim: rgba(126,170,220,.08);
  --purple: #b89aff;
  --lime: #c0e050;
  --lime-dim: rgba(192,224,80,.10);
  --radius: 16px;
  --card-radius: 22px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  background-image: radial-gradient(ellipse at 50% 0%, rgba(212,168,67,.04) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 100%, rgba(140,100,40,.03) 0%, transparent 40%);
  color: var(--ink);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Noise texture overlay ── */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: .03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px 256px;
}

/* ── Ambient background ── */
.ambient {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.ambient-orb {
  position: absolute; border-radius: 50%; filter: blur(100px); opacity: .45;
}
.orb1 { width: 700px; height: 700px; top: -250px; left: -150px; background: radial-gradient(circle, rgba(212,168,67,.25) 0%, rgba(140,90,20,.08) 50%, transparent 70%); animation: floatOrb1 12s ease-in-out infinite; }
.orb2 { width: 550px; height: 550px; bottom: -200px; right: -120px; background: radial-gradient(circle, rgba(240,208,96,.16) 0%, rgba(180,130,50,.05) 50%, transparent 70%); animation: floatOrb2 15s ease-in-out infinite; }
.orb3 { width: 400px; height: 400px; top: 45%; left: 55%; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(212,168,67,.06) 0%, transparent 70%); animation: floatOrb3 10s ease-in-out infinite; }

@keyframes floatOrb1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,20px)} }
@keyframes floatOrb2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,-30px)} }
@keyframes floatOrb3 { 0%,100%{transform:translate(-50%,-50%)} 50%{transform:translate(-45%,-55%)} }

.container {
  position: relative; z-index: 1;
  max-width: 580px; margin: 0 auto; padding: 0 16px 100px;
}

/* ── HEADER ── */
header {
  padding: 36px 0 0;
  margin-bottom: 32px;
  position: relative;
}
header::after {
  content: ''; position: absolute; bottom: -16px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,168,67,.25), rgba(240,208,96,.15), transparent);
}
.header-top {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
}
.wordmark {
  display: flex; align-items: baseline; gap: 8px;
}
.wordmark-main {
  font-family: 'Instrument Serif', serif; font-size: 1.85rem; font-style: italic;
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 45%, #c89030 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -.02em;
  filter: drop-shadow(0 0 12px rgba(212,168,67,.2));
}
.wordmark-dot {
  width: 8px; height: 8px;
  background: var(--gold);
  border-radius: 50%; margin-bottom: 3px;
  box-shadow: 0 0 10px var(--gold), 0 0 20px rgba(212,168,67,.3);
  flex-shrink: 0;
  animation: goldPulse 2.4s ease-in-out infinite;
}
@keyframes goldPulse {
  0%,100%{opacity:1; box-shadow: 0 0 10px var(--gold), 0 0 20px rgba(212,168,67,.3)}
  50%{opacity:.5; box-shadow: 0 0 6px var(--gold), 0 0 10px rgba(212,168,67,.1)}
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
.wordmark-tag {
  font-family: 'JetBrains Mono', monospace; font-size: .62rem; color: var(--ink3);
  letter-spacing: .14em; text-transform: uppercase; align-self: center;
}
.live-chip {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid rgba(212,168,67,.25); background: rgba(212,168,67,.06);
  border-radius: 999px; padding: 6px 14px;
  font-family: 'JetBrains Mono', monospace; font-size: .62rem; letter-spacing: .1em;
  color: var(--gold);
  backdrop-filter: blur(8px);
}
.blink-dot {
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--gold);
  animation: blink 2s infinite;
}

/* ── METRIC ROW ── */
.metrics {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 28px;
}
@media(max-width:480px){ .metrics { grid-template-columns: repeat(3,1fr); } }
.metric {
  background: linear-gradient(160deg, rgba(212,168,67,.04) 0%, var(--panel) 50%);
  border: 1px solid rgba(212,168,67,.12);
  border-radius: 16px;
  padding: 16px 14px; transition: border-color .3s, transform .25s, box-shadow .3s;
  position: relative; overflow: hidden;
}
.metric::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(212,168,67,.04), transparent, transparent);
  animation: shimmer 6s linear infinite;
  pointer-events: none;
}
@keyframes shimmer { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.metric::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,168,67,.2), transparent);
}
.metric:hover {
  border-color: rgba(212,168,67,.3);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,.3), 0 0 1px rgba(212,168,67,.2);
}
.metric-val {
  font-family: 'Instrument Serif', serif; font-size: 2rem; font-style: italic;
  line-height: 1; margin-bottom: 4px; position: relative; z-index: 1;
}
.metric-lbl {
  font-family: 'JetBrains Mono', monospace; font-size: .58rem; text-transform: uppercase;
  letter-spacing: .12em; color: var(--ink3); position: relative; z-index: 1;
}

/* ── FILTERS ── */
.filter-bar {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
}
.filter-label {
  font-family: 'JetBrains Mono', monospace; font-size: .6rem; text-transform: uppercase;
  letter-spacing: .12em; color: var(--gold); margin-right: 4px; align-self: center;
  opacity: .6;
}
.filter-pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 999px;
  padding: 6px 14px; font-size: .75rem; color: var(--ink2); cursor: pointer;
  transition: all .2s; white-space: nowrap; font-family: 'Space Grotesk', sans-serif;
  font-weight: 500; user-select: none;
}
.filter-pill:hover { border-color: rgba(212,168,67,.3); color: var(--ink); }
.filter-pill.active-score { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.filter-pill svg { flex-shrink: 0; }

/* Score range slider row */
.score-filter-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  background: linear-gradient(135deg, rgba(212,168,67,.03), var(--panel));
  border: 1px solid rgba(212,168,67,.12); border-radius: 14px; padding: 12px 16px;
  transition: max-height .3s ease, opacity .3s ease, padding .3s ease;
}
.score-filter-row.hidden { display: none; }
.score-filter-label { font-family: 'JetBrains Mono', monospace; font-size: .65rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink3); flex-shrink: 0; }
.score-range-wrap { flex: 1; position: relative; height: 20px; display: flex; align-items: center; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
  background: transparent; outline: none; position: relative; z-index: 2;
}
.range-track {
  position: absolute; left: 0; right: 0; height: 3px; background: var(--edge2); border-radius: 2px;
}
.range-fill {
  position: absolute; height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 2px; transition: left .1s, right .1s;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-light), var(--gold)); cursor: pointer; border: 2px solid var(--bg);
  box-shadow: 0 0 10px rgba(212,168,67,.5); transition: transform .15s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type=range]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  cursor: pointer; border: 2px solid var(--bg); box-shadow: 0 0 10px rgba(212,168,67,.5);
}
.score-vals { font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--gold); flex-shrink: 0; min-width: 40px; text-align: right; }

/* ── DECK ── */
.deck-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
}
.deck-counter {
  font-family: 'JetBrains Mono', monospace; font-size: .65rem; color: var(--ink3);
  letter-spacing: .08em;
}
.deck-counter em { color: var(--gold); font-style: normal; }
.deck-sort { display: flex; align-items: center; gap: 6px; }
.sort-btn {
  display: flex; align-items: center; gap: 5px; background: var(--panel);
  border: 1px solid var(--edge); border-radius: 8px; padding: 5px 10px;
  font-size: .68rem; color: var(--ink3); cursor: pointer; transition: all .2s;
  font-family: 'JetBrains Mono', monospace; letter-spacing: .05em;
}
.sort-btn:hover { border-color: rgba(212,168,67,.3); color: var(--ink2); }
.sort-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

.card-stack {
  position: relative; width: 100%; height: 430px;
  touch-action: none; user-select: none; margin-bottom: 20px;
}

/* ── JOB CARD ── */
.job-card {
  position: absolute; inset: 0;
  background: var(--panel); border: 1px solid var(--edge);
  border-radius: var(--card-radius);
  padding: 26px 26px 22px;
  display: flex; flex-direction: column;
  cursor: grab; will-change: transform;
  overflow: hidden;
}
.job-card::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,.025) 0%, transparent 60%);
  pointer-events: none;
}
.job-card:active { cursor: grabbing; }
.job-card.back-1 { transform: translateY(10px) scale(.96); z-index: 1; }
.job-card.back-2 { transform: translateY(20px) scale(.92); z-index: 0; }
.job-card.top { z-index: 10; }

@keyframes flyLeft  { to { transform: translateX(-140%) rotate(-22deg) scale(.9); opacity: 0; } }
@keyframes flyRight { to { transform: translateX(140%) rotate(22deg) scale(.9); opacity: 0; } }
@keyframes flyUp    { to { transform: translateY(-130%) scale(.85); opacity: 0; } }
.job-card.fly-left  { animation: flyLeft  .4s cubic-bezier(.4,0,.6,1) forwards; }
.job-card.fly-right { animation: flyRight .4s cubic-bezier(.4,0,.6,1) forwards; }
.job-card.fly-up    { animation: flyUp    .35s cubic-bezier(.4,0,.6,1) forwards; }

/* Intent overlays */
.intent {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .1s; font-family: 'Instrument Serif', serif;
  font-size: 1.4rem; font-style: italic; letter-spacing: -.01em;
}
.intent-skip { background: linear-gradient(135deg, rgba(232,85,85,.18) 0%, transparent 60%); color: var(--red); }
.intent-open { background: linear-gradient(180deg, rgba(212,168,67,.2) 0%, transparent 60%); color: var(--gold); }
.intent-badge {
  position: absolute; padding: 6px 14px; border-radius: 999px; font-size: .8rem;
  font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: .04em;
  backdrop-filter: blur(4px);
}
.intent-skip .intent-badge { top: 28px; left: 28px; background: rgba(232,85,85,.2); border: 1.5px solid var(--red); color: var(--red); }
.intent-open .intent-badge { bottom: 70px; left: 50%; transform: translateX(-50%); background: rgba(212,168,67,.12); border: 1.5px solid var(--gold); color: var(--gold); white-space: nowrap; }

/* Card content */
.card-score-strip {
  display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;
}
.score-ring {
  position: relative; width: 60px; height: 60px; flex-shrink: 0;
}
.score-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.score-ring-center {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.score-num { font-family: 'Instrument Serif', serif; font-size: 1.4rem; font-style: italic; line-height: 1; }
.score-of { font-family: 'JetBrains Mono', monospace; font-size: .48rem; color: var(--ink3); letter-spacing: .08em; }
.card-brand { flex: 1; padding-left: 16px; }
.card-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--ink); line-height: 1.2; margin-bottom: 5px; }
.card-co { font-size: .85rem; font-weight: 600; color: var(--purple); }

.card-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
.chip {
  display: flex; align-items: center; gap: 5px;
  background: var(--panel2); border: 1px solid var(--edge); border-radius: 8px;
  padding: 4px 10px; font-size: .72rem; color: var(--ink3); font-family: 'Space Grotesk', sans-serif;
}
.chip.hot { border-color: rgba(212,168,67,.3); color: var(--gold); background: var(--gold-dim); }
.chip.match-high { border-color: rgba(192,224,80,.3); color: var(--lime); background: var(--lime-dim); }
.chip.match-mid  { border-color: rgba(212,168,67,.3); color: var(--gold); background: var(--gold-dim); }
.chip.match-low  { border-color: rgba(232,85,85,.3); color: var(--red); background: var(--red-dim); }

.card-sep { height: 1px; background: linear-gradient(90deg, var(--edge), transparent); margin-bottom: 14px; }

.card-reason { font-size: .8rem; color: var(--ink2); line-height: 1.65; flex: 1; }
.card-reason strong { color: var(--ink); font-weight: 600; }

.card-skills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.skill-tag {
  font-family: 'JetBrains Mono', monospace; font-size: .62rem; letter-spacing: .04em;
  background: rgba(212,168,67,.06); border: 1px solid rgba(212,168,67,.18);
  border-radius: 6px; padding: 3px 8px; color: var(--gold);
}

/* ── JOB DESCRIPTION ── */
.card-desc-wrap {
  margin-top: 12px;
  border-top: 1px solid var(--edge);
  padding-top: 10px;
  flex-shrink: 0;
}
.card-desc-toggle {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; cursor: pointer; padding: 0;
  font-family: 'JetBrains Mono', monospace; font-size: .6rem;
  letter-spacing: .1em; text-transform: uppercase; color: var(--blue);
  opacity: .75; transition: opacity .2s;
  user-select: none;
}
.card-desc-toggle:hover { opacity: 1; }
.card-desc-toggle svg { transition: transform .25s; flex-shrink: 0; }
.card-desc-toggle.open svg { transform: rotate(180deg); }
.card-desc-body {
  display: none; margin-top: 8px;
  max-height: 110px; overflow-y: auto;
  font-size: .76rem; color: var(--ink2); line-height: 1.6;
  scrollbar-width: thin; scrollbar-color: var(--edge2) transparent;
}
.card-desc-body::-webkit-scrollbar { width: 4px; }
.card-desc-body::-webkit-scrollbar-thumb { background: var(--edge2); border-radius: 4px; }
.card-desc-body.open { display: block; }

/* ── ACTIONS ── */
.actions {
  display: flex; justify-content: center; align-items: center; gap: 14px;
}
.act {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 50px; cursor: pointer; font-family: 'Space Grotesk', sans-serif;
  font-weight: 600; font-size: .82rem; transition: transform .15s, box-shadow .25s, background .2s;
  border: none;
}
.act:hover { transform: translateY(-2px); }
.act:active { transform: scale(.94); }
.act-skip {
  padding: 12px 22px;
  background: var(--panel); border: 1px solid var(--edge);
  color: var(--red);
}
.act-skip:hover { background: var(--red-dim); border-color: rgba(232,85,85,.35); }
.act-open {
  padding: 14px 36px;
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, #c89030 100%);
  color: #0a0800;
  box-shadow: 0 4px 20px rgba(212,168,67,.3), 0 0 0 1px rgba(240,208,96,.15);
  font-weight: 700; letter-spacing: .02em;
}
.act-open:hover {
  box-shadow: 0 8px 32px rgba(212,168,67,.45), 0 0 0 1px rgba(240,208,96,.3);
}

.keys {
  text-align: center; margin-top: 14px;
  font-family: 'JetBrains Mono', monospace; font-size: .58rem; color: var(--ink3); letter-spacing: .08em;
}
.keys kbd {
  display: inline-block; background: var(--panel2); border: 1px solid var(--edge2);
  border-radius: 4px; padding: 2px 6px; font-family: inherit; font-size: inherit; color: var(--ink2);
}

/* ── DONE STATE ── */
.done-state { text-align: center; padding: 64px 24px; }
.done-emo { font-size: 2.5rem; margin-bottom: 16px; }
.done-h { font-family: 'Instrument Serif', serif; font-size: 1.6rem; font-style: italic; color: var(--gold); margin-bottom: 8px; }
.done-sub { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--ink3); letter-spacing: .06em; }
.done-restart {
  margin-top: 24px; display: inline-flex; align-items: center; gap: 8px;
  background: var(--panel2); border: 1px solid rgba(212,168,67,.2); border-radius: 12px;
  color: var(--gold); padding: 10px 20px; font-family: 'Space Grotesk', sans-serif;
  font-weight: 600; font-size: .82rem; cursor: pointer; transition: all .25s;
}
.done-restart:hover { border-color: var(--gold); box-shadow: var(--gold-glow); }

/* ── EMPTY FILTER STATE ── */
.empty-filter {
  text-align: center; padding: 48px 24px;
  font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--ink3); letter-spacing: .06em;
}
.empty-filter span { display: block; font-size: 1.8rem; margin-bottom: 12px; }

footer {
  border-top: 1px solid rgba(212,168,67,.1); margin-top: 48px; padding-top: 16px;
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  font-family: 'JetBrains Mono', monospace; font-size: .6rem; color: var(--ink3); letter-spacing: .06em;
}
footer em { color: var(--gold); font-style: normal; }
</style>
</head>
<body>

<div class="ambient">
  <div class="ambient-orb orb1"></div>
  <div class="ambient-orb orb2"></div>
  <div class="ambient-orb orb3"></div>
</div>

<div class="container">

  <header>
    <div class="header-top">
      <div class="wordmark">
        <span class="wordmark-main">Job Radar</span>
        <div class="wordmark-dot"></div>
        <span class="wordmark-tag">swipe · apply</span>
      </div>
      <div class="live-chip">
        <div class="blink-dot"></div>
        LIVE
      </div>
    </div>
  </header>

  <div class="metrics">
    <div class="metric">
      <div class="metric-val" id="mTotal" style="color:var(--ink)">—</div>
      <div class="metric-lbl">Total</div>
    </div>
    <div class="metric">
      <div class="metric-val" id="mHigh" style="color:var(--gold)">—</div>
      <div class="metric-lbl">Top Matches</div>
    </div>
    <div class="metric">
      <div class="metric-val" id="mAvg" style="color:var(--purple)">—</div>
      <div class="metric-lbl">Avg Score</div>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <span class="filter-label">Filter</span>
    <button class="filter-pill" id="btnFilterScore" onclick="toggleScoreFilter()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Score
    </button>
    <div class="filter-divider"></div>
    <button class="sort-btn active" id="btnSortScore" onclick="setSort('score')">Score ↓</button>
    <button class="sort-btn" id="btnSortDate" onclick="setSort('date')">Newest</button>
  </div>

  <!-- Score filter expanded -->
  <div class="score-filter-row hidden" id="scoreFilterRow">
    <span class="score-filter-label">Min</span>
    <div class="score-range-wrap">
      <div class="range-track"></div>
      <div class="range-fill" id="rangeFill"></div>
      <input type="range" id="scoreMin" min="0" max="10" step="0.5" value="0" oninput="onScoreRange()">
    </div>
    <span class="score-filter-label">Max</span>
    <div class="score-range-wrap">
      <div class="range-track"></div>
      <div class="range-fill" id="rangeFill2"></div>
      <input type="range" id="scoreMax" min="0" max="10" step="0.5" value="10" oninput="onScoreRange()">
    </div>
    <span class="score-vals" id="scoreVals">0–10</span>
  </div>

  <!-- Deck -->
  <div id="deckWrap">
    <div class="deck-header">
      <div class="deck-counter" id="deckCounter"><em>—</em> remaining</div>
    </div>
    <div class="card-stack" id="cardStack"></div>
    <div class="actions">
      <button class="act act-skip" onclick="swipe('left')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Skip
      </button>
      <button class="act act-open" onclick="openCurrent()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Apply
      </button>
    </div>
    <p class="keys"><kbd>←</kbd> Skip &nbsp;·&nbsp; <kbd>→</kbd> Next &nbsp;·&nbsp; <kbd>↑</kbd> Apply</p>
  </div>

  <footer>
    <span>Source: Google Sheets</span>
    <span>Fetched <em id="fetchTime">—</em></span>
  </footer>

</div>

<script>
const CSV_URL = `https://docs.google.com/spreadsheets/d/e/2PACX-1vSpJuMPpVY94UkVHBiY19uwe9PkygVMjhVsICLzwRI2QzVjriFdQDYL5VHwV7RQdslVoqACFXci5Kc8/pub?gid=0&single=true&output=csv`;

let allJobs = [], queue = [];
let scoreMin = 0, scoreMax = 10;
let sortMode = 'score';
let isDragging = false, startX = 0, startY = 0, curX = 0, curY = 0;
let topCard = null;

// ── FETCH ──
async function loadData() {
  showLoading();
  try {
    const res = await fetch(CSV_URL + '&_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    allJobs = parseCSV(text);
    if (!allJobs.length) throw new Error('No jobs found');
    buildQueue();
    updateMetrics();
    renderDeck();
    document.getElementById('fetchTime').textContent = new Date().toLocaleTimeString();
  } catch(e) {
    showError(e.message);
  }
}

function parseCSV(text) {
  const rows = [], lines = text.split('\n');
  if (lines.length < 2) return rows;
  const headers = parseLine(lines[0]).map(h => h.trim().toLowerCase().replace(/[^a-z0-9]/g,'_'));
  for (let i = 1; i < lines.length; i++) {
    const ln = lines[i].trim(); if (!ln) continue;
    const cols = parseLine(ln), obj = {};
    headers.forEach((h,x) => { obj[h] = (cols[x]||'').trim(); });
    if (!obj.job_title && !obj.company) continue;
    // parse date_added — try multiple possible column names
    const rawDate = obj.date_added || obj.added_date || obj.added || obj.date || obj.posted_date || '';
    obj._date = parseDate(rawDate);
    // Also store the row index as fallback ordering (later rows = more recent)
    obj._rowIndex = i;
    rows.push(obj);
  }
  return rows;
}

// Robust date parser: handles "DD/MM/YYYY", "MM/DD/YYYY", "YYYY-MM-DD", and natural date strings
function parseDate(raw) {
  if (!raw) return null;
  raw = raw.trim();
  // Try DD/MM/YYYY or DD-MM-YYYY format (common in Indian locale / Google Sheets)
  const slashMatch = raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (slashMatch) {
    let [, d, m, y] = slashMatch;
    if (y.length === 2) y = '20' + y;
    // If first number > 12, it's definitely DD/MM/YYYY
    // Otherwise try DD/MM/YYYY by default (Indian locale)
    const day = parseInt(d), month = parseInt(m);
    if (month >= 1 && month <= 12) {
      const date = new Date(parseInt(y), month - 1, day);
      if (!isNaN(date)) return date;
    }
    // Fallback: try as MM/DD/YYYY
    if (day >= 1 && day <= 12) {
      const date = new Date(parseInt(y), day - 1, month);
      if (!isNaN(date)) return date;
    }
  }
  // Try standard Date parsing (ISO, etc)
  const d = new Date(raw);
  if (!isNaN(d)) return d;
  return null;
}

function parseLine(line) {
  const r = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c==='"') { if (q && line[i+1]==='"'){ cur+='"'; i++; } else q=!q; }
    else if (c===',' && !q) { r.push(cur); cur=''; }
    else cur += c;
  }
  r.push(cur); return r;
}

// ── FILTERS + QUEUE ──
function buildQueue() {
  let jobs = allJobs.filter(j => {
    const s = parseFloat(j.score)||0;
    if (s < scoreMin || s > scoreMax) return false;
    return true;
  });
  if (sortMode === 'score') {
    jobs.sort((a,b) => (parseFloat(b.score)||0) - (parseFloat(a.score)||0));
  } else {
    // Sort by date: most recently added first
    jobs.sort((a,b) => {
      const ta = a._date ? a._date.getTime() : a._rowIndex;
      const tb = b._date ? b._date.getTime() : b._rowIndex;
      return tb - ta;
    });
  }
  queue = jobs;
}

function applyFilters() {
  buildQueue();
  renderDeck();
  updateMetrics();
}

// ── UI CONTROLS ──
function toggleScoreFilter() {
  const row = document.getElementById('scoreFilterRow');
  const btn = document.getElementById('btnFilterScore');
  row.classList.toggle('hidden');
  const hidden = row.classList.contains('hidden');
  btn.classList.toggle('active-score', !hidden);
}
function onScoreRange() {
  scoreMin = parseFloat(document.getElementById('scoreMin').value);
  scoreMax = parseFloat(document.getElementById('scoreMax').value);
  if (scoreMin > scoreMax) { const t=scoreMin; scoreMin=scoreMax; scoreMax=t; }
  document.getElementById('scoreVals').textContent = scoreMin + '–' + scoreMax;
  updateRangeFill('scoreMin','rangeFill');
  updateRangeFill('scoreMax','rangeFill2');
  applyFilters();
}
function updateRangeFill(inputId, fillId) {
  const inp = document.getElementById(inputId);
  const fill = document.getElementById(fillId);
  const pct = ((inp.value - inp.min) / (inp.max - inp.min)) * 100;
  fill.style.width = pct + '%';
}

function setSort(mode) {
  sortMode = mode;
  document.getElementById('btnSortScore').classList.toggle('active', mode==='score');
  document.getElementById('btnSortDate').classList.toggle('active', mode==='date');
  applyFilters();
}

// ── METRICS ──
function updateMetrics() {
  const scores = allJobs.map(j=>parseFloat(j.score)).filter(s=>!isNaN(s));
  const avg = scores.length ? (scores.reduce((a,b)=>a+b)/scores.length).toFixed(1) : '—';
  document.getElementById('mTotal').textContent = allJobs.length;
  document.getElementById('mHigh').textContent = scores.filter(s=>s>=8).length;
  document.getElementById('mAvg').textContent = avg;
}

// ── RENDER DECK ──
function renderDeck() {
  const stack = document.getElementById('cardStack');
  stack.innerHTML = '';
  if (!queue.length) { showDone(); return; }
  document.getElementById('deckCounter').innerHTML = `<em>${queue.length}</em> remaining`;
  const show = Math.min(3, queue.length);
  for (let i = show-1; i >= 0; i--) {
    stack.appendChild(buildCard(queue[i], i));
  }
  topCard = stack.querySelector('.top');
  if (topCard) attachDrag(topCard);
}

function buildCard(job, pos) {
  const score = parseFloat(job.score)||0;
  const tier = score>=8?'high':score>=5?'mid':'low';
  const scoreColor = tier==='high'?'var(--lime)':tier==='mid'?'var(--amber)':'var(--red)';
  const trackColor = tier==='high'?'#b6f542':tier==='mid'?'#ffb830':'#ff4f4f';
  const pct = (score/10)*100;
  const r = 24, circ = 2*Math.PI*r;
  const dash = (pct/100)*circ;

  const url = job.job_url||job['job-url']||job.joburl||job.url||'';
  const loc  = job.location||'';
  const apps = job.application_count||'';
  const dateStr = job._date ? job._date.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'2-digit'}) : (job.posted_date || job.date_added || '');
  const reason = job.reason||'';
  const tags = extractTags(job);
  const desc = job.job_description || job.jobdescription || job.description || '';

  const div = document.createElement('div');
  div.className = 'job-card ' + (pos===0?'top':pos===1?'back-1':'back-2');
  div.dataset.url = url;

  div.innerHTML = `
    <div class="intent intent-skip"><div class="intent-badge">✕ Skip</div></div>
    <div class="intent intent-open"><div class="intent-badge">↗ Open & Apply</div></div>

    <div class="card-score-strip">
      <div class="score-ring">
        <svg viewBox="0 0 60 60" width="60" height="60">
          <circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--edge)" stroke-width="3"/>
          <circle cx="30" cy="30" r="${r}" fill="none" stroke="${trackColor}" stroke-width="3"
            stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}"
            stroke-linecap="round" opacity=".85"/>
        </svg>
        <div class="score-ring-center">
          <span class="score-num" style="color:${scoreColor}">${score||'?'}</span>
          <span class="score-of">/10</span>
        </div>
      </div>
      <div class="card-brand">
        <div class="card-title">${esc(job.job_title||'Untitled')}</div>
        <div class="card-co">${esc(job.company||'—')}</div>
      </div>
    </div>

    <div class="card-chips">
      ${loc ? `<div class="chip"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(loc)}</div>` : ''}
      ${dateStr ? `<div class="chip"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${esc(dateStr)}</div>` : ''}
      ${apps ? `<div class="chip hot"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>${esc(apps)} applicants</div>` : ''}
      <div class="chip ${tier==='high'?'match-high':tier==='mid'?'match-mid':'match-low'}">${tier==='high'?'Top match':tier==='mid'?'Mid match':'Low match'}</div>
    </div>

    <div class="card-sep"></div>
    ${reason ? `<div class="card-reason">${esc(reason)}</div>` : ''}
    ${tags.length ? `<div class="card-skills">${tags.map(t=>`<span class="skill-tag">${esc(t)}</span>`).join('')}</div>` : ''}
    ${desc ? `
    <div class="card-desc-wrap">
      <button class="card-desc-toggle" onclick="toggleDesc(this)" onpointerdown="event.stopPropagation()">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        Job Description
      </button>
      <div class="card-desc-body">${esc(desc)}</div>
    </div>` : ''}
  `;
  return div;
}

function toggleDesc(btn) {
  btn.classList.toggle('open');
  const body = btn.nextElementSibling;
  body.classList.toggle('open');
}

function extractTags(job) {
  const raw = job.skills||job.tags||job.keywords||'';
  if (raw) return raw.split(/[,;|]/).map(t=>t.trim()).filter(Boolean).slice(0,5);
  const t = (job.job_title||'').toLowerCase();
  const out = [];
  ['react','node','python','java','typescript','go','rust','vue','angular','django','aws','docker','kubernetes','data','ml','ai','devops','backend','frontend'].forEach(k=>{
    if (t.includes(k)) out.push(k.charAt(0).toUpperCase()+k.slice(1));
  });
  return out.slice(0,4);
}

// ── DRAG ──
function attachDrag(card) { card.addEventListener('pointerdown', onDown); }

function onDown(e) {
  if (!topCard || topCard.className.includes('fly')) return;
  isDragging = true;
  startX = e.clientX; startY = e.clientY;
  topCard.setPointerCapture(e.pointerId);
  topCard.addEventListener('pointermove', onMove);
  topCard.addEventListener('pointerup', onUp);
  topCard.addEventListener('pointercancel', onUp);
}

function onMove(e) {
  if (!isDragging) return;
  curX = e.clientX - startX;
  curY = e.clientY - startY;
  const rot = curX * 0.05;
  topCard.style.transform = `translate(${curX}px,${curY}px) rotate(${rot}deg)`;

  const skip = topCard.querySelector('.intent-skip');
  const open = topCard.querySelector('.intent-open');
  const absX = Math.abs(curX), absY = Math.abs(curY);

  skip.style.opacity = open.style.opacity = '0';
  if (curY < -60 && absY > absX) open.style.opacity = Math.min(1,absY/100).toFixed(2);
  else if (curX < -30) skip.style.opacity = Math.min(1,absX/80).toFixed(2);
}

function onUp() {
  if (!isDragging) return;
  isDragging = false;
  topCard.removeEventListener('pointermove', onMove);
  topCard.removeEventListener('pointerup', onUp);
  topCard.removeEventListener('pointercancel', onUp);

  const absX = Math.abs(curX), absY = Math.abs(curY);
  if (curY < -100 && absY > absX) { openCurrent(); resetCard(); return; }
  if (curX < -80) { swipe('left'); return; }
  if (curX > 80)  { swipe('right'); return; }

  topCard.style.transition = 'transform .32s cubic-bezier(.34,1.56,.64,1)';
  topCard.style.transform = '';
  clearIntents();
  setTimeout(()=>{ if(topCard) topCard.style.transition=''; }, 340);
}

function resetCard() { if(topCard){ topCard.style.transform=''; clearIntents(); } }
function clearIntents() { if(!topCard) return; topCard.querySelectorAll('.intent').forEach(i=>i.style.opacity='0'); }

function swipe(dir) {
  if (!queue.length || !topCard) return;
  clearIntents();
  topCard.style.transition='';
  topCard.style.transform='';
  topCard.classList.add(dir==='left'?'fly-left':'fly-right');
  queue.shift();
  setTimeout(renderDeck, 420);
}

function openCurrent() {
  const url = topCard?.dataset?.url;
  if (url) window.open(url,'_blank','noopener');
}

document.addEventListener('keydown', e => {
  if (e.key==='ArrowLeft')  swipe('left');
  if (e.key==='ArrowRight') swipe('right');
  if (e.key==='ArrowUp')    { openCurrent(); swipe('right'); }
});

// ── STATES ──
function showLoading() {
  document.getElementById('cardStack').innerHTML = `
    <div class="job-card top" style="display:flex;align-items:center;justify-content:center;gap:14px;cursor:default">
      <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--edge2)" stroke-width="2"/><path d="M12 2a10 10 0 0110 10" fill="none" stroke="var(--lime)" stroke-width="2" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 12 12;360 12 12" dur=".8s" repeatCount="indefinite"/></path></svg>
      <span style="font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--ink3)">loading jobs…</span>
    </div>`;
}
function showError(msg) {
  document.getElementById('cardStack').innerHTML = `
    <div class="job-card top" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:default;text-align:center">
      <span style="font-size:2rem">⚠️</span>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:700">Failed to load</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--ink3)">${esc(msg)}</span>
      <button onclick="loadData()" style="margin-top:8px;padding:8px 20px;background:var(--panel2);border:1px solid var(--edge2);border-radius:10px;color:var(--ink);font-family:'Space Grotesk',sans-serif;cursor:pointer">Retry</button>
    </div>`;
}
function showDone() {
  document.getElementById('cardStack').innerHTML = `
    <div class="done-state">
      <div class="done-emo">${queue.length===0 && allJobs.length>0 ? '🔍' : '🎉'}</div>
      <div class="done-h">${queue.length===0 && allJobs.length>0 ? 'No matches for these filters' : 'All reviewed!'}</div>
      <div class="done-sub">${allJobs.length} total jobs</div>
      ${allJobs.length > 0 ? `<button class="done-restart" onclick="resetQueue()">↺ Review again</button>` : ''}
    </div>`;
  document.getElementById('deckCounter').innerHTML = `<em>0</em> remaining`;
}
function resetQueue() { buildQueue(); renderDeck(); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Init range fills
updateRangeFill('scoreMin','rangeFill');
updateRangeFill('scoreMax','rangeFill2');

loadData();
</script>
</body>
</html>
